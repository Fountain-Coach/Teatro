openapi: 3.0.3
info:
  title: Teatro Render API
  version: '0.1.0'
  description: Minimal placeholder schema for RenderCLI alignment.
paths:
  /render:
    post:
      summary: Render a document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenderRequest'
      responses:
        '200':
          description: Render success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderResponse'
components:
  schemas:
    RenderRequest:
      type: object
      properties:
        input:
          type: string
          description: Input file path
        format:
          type: string
          description: Output format identifier (e.g., svg, html, png)
        output:
          type: string
          description: Output file path
        forceFormat:
          type: boolean
          description: Override extension-based format detection
        watch:
          type: boolean
          description: Watch the input file for changes
        midi1Bridge:
          type: boolean
          description: Bridge UMP input to MIDI 1.0 byte stream for legacy devices
        watchRtpmidi:
          type: boolean
          description: Subscribe to RTP-MIDI UMP packets and forward them to stdout
        sseGroup:
          type: integer
          description: Filter incoming UMP stream by group
        saveUmp:
          type: string
          description: Persist received UMP packets to the given file
        replayUmp:
          type: string
          description: Replay UMP packets from file
        width:
          type: integer
          description: Override output width
        height:
          type: integer
          description: Override output height
    RenderResponse:
      type: object
      properties:
        ok:
          type: boolean
        outputPath:
          type: string
